[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tesserae-dl"  # the import name is `tess_dl`
version = "0.1.1"
description = "TDL, the Tesserae Data Language: a lossless parser for the files the Tesserae Shell reads."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Mind Derivative" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mindderivative/tess-dl"
Issues = "https://github.com/mindderivative/tess-dl/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "hypothesis>=6.100"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/tess_dl"]

[tool.hatch.build.targets.sdist]
# What ships: the library, its licence, the docs that describe the language, and the tests with
# the conformance corpus (test data the Tesserae Shell reads). Not the agent instructions, hooks,
# skills, tools, benchmarks or notes (some are machine-local or third-party).
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/docs/language.md",
    "/docs/api.md",
    "/docs/decisions.md",
    "/docs/versioning.md",
    "/docs/benchmarks.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]  # third-party skills, kept as published
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
