[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tesserae-dl"  # the import name is `tdl`
version = "0.1.0.dev0"
description = "TDL, the Tesserae Data Language: a lossless parser for the files the Tesserae Shell reads."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Mind Derivative" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mindderivative/tess-dl"
Issues = "https://github.com/mindderivative/tess-dl/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "hypothesis>=6.100"]

[tool.hatch.build.targets.wheel]
packages = ["src/tdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]  # third-party skills, kept as published
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
